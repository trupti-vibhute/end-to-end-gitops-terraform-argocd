apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: 3tier-app
  namespace: argocd
  # Deleting this Application also deletes everything it deployed
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  source:
    repoURL: https://github.com/trupti-vibhute/end-to-end-gitops-terraform-argocd.git
    targetRevision: main
    path: manifests
  destination:
    server: https://kubernetes.default.svc
    namespace: 3tirewebapp-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
